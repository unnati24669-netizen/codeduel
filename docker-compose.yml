services:

  redis:
    image: redis:alpine
    ports:
        - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    

  backend:
    build: ./backend

    env_file: ./backend/.env

    environment:
     REDIS_URL: redis://redis:6379
     NODE_OPTIONS: --dns-result-order=ipv4first

    ports:
     - "5500:5500"

    depends_on:
      redis:
        condition: service_healthy


  frontend:
    build: 
     context: ./frontend
     args: 
       - VITE_BACKEND_URL=http://localhost:5500
      

    ports:
     - "5173:80"


    
    




   
 
  
  

