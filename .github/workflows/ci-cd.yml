name: codeduel

on:
   
  push: 
   branches: [main]

  pull_request: 
   branches: [main]

 
jobs: 

  
  
  build-backend :
    runs-on: ubuntu-latest
    services:
     redis:
      image: redis:7
      ports:
        - 6379:6379

    defaults:
     run:

        working-directory: ./backend

    steps:

     - uses: actions/checkout@v4
     - uses: actions/setup-node@v4
       with:
        node-version: 22
        cache: npm
        cache-dependency-path: ./backend/package-lock.json

     - run: npm ci
     - run: npx jest 

  build-frontend :
    runs-on: ubuntu-latest
    defaults:
     run:
        working-directory: ./frontend

    steps:

     - uses: actions/checkout@v4
     - uses: actions/setup-node@v4
       with:
        node-version: 22
        cache: npm
        cache-dependency-path: ./frontend/package-lock.json

     - run: npm ci
     - run: npm run build
     

  docker:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name=='push' && github.ref=='refs/heads/main'

    steps:

     - uses: actions/checkout@v4

     - name: Check Docker Hub username
       env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
       run: |
        if [ -z "$DOCKERHUB_USERNAME" ]; then
        echo "❌ DOCKERHUB_USERNAME IS EMPTY"
        exit 1
        else
        echo "✅ DOCKERHUB_USERNAME is available"
        fi
     - uses: docker/login-action@v3
       with: 
         username: ${{secrets.DOCKERHUB_USERNAME}}
         password: ${{secrets.DOCKERHUB_TOKEN}}

     - uses: docker/setup-buildx-action@v3
     - uses: docker/build-push-action@v6
       with: 
         context: ./backend
         file: ./backend/Dockerfile
         push: true
         tags: ${{secrets.DOCKERHUB_USERNAME}}/codeduel-backend:latest

     - uses: docker/build-push-action@v6
       with:
         context: ./frontend
         file: ./frontend/Dockerfile
         push: true
         tags:  ${{secrets.DOCKERHUB_USERNAME}}/codeduel-frontend:latest



    


